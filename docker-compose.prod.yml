# 🐳 Docker Compose Production - Katiopa MVP
version: '3.9'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: katiopa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-katiopa_db}
      POSTGRES_USER: ${DATABASE_USER:-katiopa_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=fr_FR.UTF-8 --lc-ctype=fr_FR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    ports:
      - "5432:5432"
    networks:
      - katiopa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-katiopa_user} -d ${DATABASE_NAME:-katiopa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: katiopa-backend
    restart: unless-stopped
    environment:
      # Base de données
      DATABASE_URL: postgresql://${DATABASE_USER:-katiopa_user}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-katiopa_db}
      
      # JWT et Sécurité
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Emails (optionnel)
      NOREPLY_EMAIL_USER: ${NOREPLY_EMAIL_USER}
      NOREPLY_EMAIL_PASSWORD: ${NOREPLY_EMAIL_PASSWORD}
      SUPPORT_EMAIL_USER: ${SUPPORT_EMAIL_USER}
      SUPPORT_EMAIL_PASSWORD: ${SUPPORT_EMAIL_PASSWORD}
      HELLO_EMAIL_USER: ${HELLO_EMAIL_USER}
      HELLO_EMAIL_PASSWORD: ${HELLO_EMAIL_PASSWORD}
      
      # Configuration serveur
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: https://${DOMAIN_NAME}
      
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - katiopa-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: katiopa-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000
      DOMAIN_NAME: ${DOMAIN_NAME}
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN_NAME}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - katiopa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: katiopa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/sites-available:ro
      - ./ssl:/etc/ssl/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - katiopa-network

  # Redis pour le cache (optionnel)
  redis:
    image: redis:7-alpine
    container_name: katiopa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - katiopa-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  katiopa-network:
    driver: bridge

